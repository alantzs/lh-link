<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOL FUNK - Listhaten Records</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; }
        .bg-blur {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('cover.jpg') center/cover;
            filter: blur(80px) brightness(0.2); z-index: -1; transform: scale(1.2);
        }
        .font-dela { font-family: 'Dela Gothic One', cursive; text-transform: uppercase; }
        .btn-platform {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.1rem 1.5rem; border-radius: 1.2rem;
        }
        .btn-platform:hover { background: white; color: black; transform: translateY(-3px); }
        .platform-name { font-weight: 900; text-transform: uppercase; font-style: italic; font-size: 0.8rem; }
        .btn-action { font-size: 0.65rem; font-weight: 900; opacity: 0.5; text-transform: uppercase; }
        .btn-platform:hover .btn-action { opacity: 1; }
    </style>
</head>
<body class="flex flex-col items-center py-10 px-6">

    <div class="bg-blur"></div>

    <div class="w-full max-w-[400px]">
        <div class="relative mb-8 group">
            <img src="cover.jpg" alt="Cover" class="rounded-[2.5rem] w-full aspect-square object-cover border border-white/5 shadow-2xl transition duration-500 group-hover:scale-[1.01]">
            <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-1.5 rounded-full shadow-2xl">
                <span class="font-dela text-[9px] tracking-widest">OUT NOW</span>
            </div>
        </div>

        <div class="text-center mb-10">
            <h1 class="font-dela text-3xl italic tracking-tighter mb-1">FOOL FUNK</h1>
            <p class="text-[10px] opacity-30 font-black uppercase tracking-[0.5em]">Listhaten Records</p>
        </div>

        <div class="space-y-3">
            <a href="https://music.apple.com/us/album/1867591649?app=music" target="_blank" class="btn-platform">
                <span class="platform-name">Apple Music</span>
                <span class="btn-action">Слушать</span>
            </a>
            <a href="https://music.apple.com/us/album/1867591649?app=itunes" target="_blank" class="btn-platform">
                <span class="platform-name">iTunes</span>
                <span class="btn-action">Купить</span>
            </a>
            <a href="https://www.deezer.com/album/893690512" target="_blank" class="btn-platform">
                <span class="platform-name">Deezer</span>
                <span class="btn-action">Слушать</span>
            </a>
            <a href="https://music.mts.ru/album/40120234" target="_blank" class="btn-platform">
                <span class="platform-name">МТС Музыка / КИОН</span>
                <span class="btn-action">Слушать</span>
            </a>
            <a href="https://music.vk.com/link/Zp5h2" target="_blank" class="btn-platform">
                <span class="platform-name">VK Музыка</span>
                <span class="btn-action">Слушать</span>
            </a>
            <a href="https://music.yandex.ru/album/40120234" target="_blank" class="btn-platform">
                <span class="platform-name">Яндекс Музыка</span>
                <span class="btn-action">Слушать</span>
            </a>
        </div>

        <footer class="mt-16 text-center">
            <p class="font-dela text-[10px] italic opacity-20 hover:opacity-100 transition duration-700">© 2026 LH DISTRIBUTION</p>
        </footer>
    </div>

</body>
</html>
