<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOL FUNK - Listhaten Records</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; }
        /* Фон с блюром */
        .bg-blur {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('cover.jpg') center/cover;
            filter: blur(80px) brightness(0.2); z-index: -1; transform: scale(1.2);
        }
        .font-dela { font-family: 'Dela Gothic One', cursive; text-transform: uppercase; }
        .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); }
        /* Кнопки площадок */
        .btn-platform {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.25rem; border-radius: 1rem; width: 100%;
        }
        .btn-platform:hover { background: #9333ea; border-color: #a855f7; transform: translateY(-2px); }
        .platform-name { font-weight: 900; text-transform: uppercase; font-style: italic; font-size: 0.75rem; letter-spacing: 0.05em; }
        .btn-action { font-size: 0.6rem; font-weight: 900; opacity: 0.4; text-transform: uppercase; }
    </style>
</head>
<body class="flex flex-col items-center py-12 px-6">

    <div class="bg-blur"></div>

    <div class="w-full max-w-[400px]">
        <div class="relative mb-8 shadow-[0_30px_60px_rgba(0,0,0,0.8)]">
            <img src="cover.jpg" alt="Cover" class="rounded-[2rem] w-full aspect-square object-cover border border-white/10">
            <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 bg-white text-black px-4 py-1 rounded-full shadow-xl">
                <span class="font-dela text-[8px] tracking-widest">NEW RELEASE</span>
            </div>
        </div>

        <div class="text-center mb-10">
            <h1 class="font-dela text-3xl italic tracking-tighter mb-1">FOOL FUNK</h1>
            <p class="text-[9px] opacity-30 font-black uppercase tracking-[0.5em]">Listhaten Records</p>
        </div>

        <div class="space-y-3">
            <a href="#" target="_blank" class="btn-platform group">
                <span class="platform-name">Apple Music</span>
                <span class="btn-action group-hover:opacity-100">Слушать</span>
            </a>
            <a href="#" target="_blank" class="btn-platform group">
                <span class="platform-name">Spotify</span>
                <span class="btn-action group-hover:opacity-100">Слушать</span>
            </a>
            <a href="#" target="_blank" class="btn-platform group">
                <span class="platform-name">VK Music</span>
                <span class="btn-action group-hover:opacity-100">Слушать</span>
            </a>
            <a href="#" target="_blank" class="btn-platform group">
                <span class="platform-name">Yandex Music</span>
                <span class="btn-action group-hover:opacity-100">Слушать</span>
            </a>
            <a href="#" target="_blank" class="btn-platform group">
                <span class="platform-name">YouTube Music</span>
                <span class="btn-action group-hover:opacity-100">Смотреть</span>
            </a>
            <a href="#" target="_blank" class="btn-platform group">
                <span class="platform-name">SoundCloud</span>
                <span class="btn-action group-hover:opacity-100">Слушать</span>
            </a>
            <a href="#" target="_blank" class="btn-platform group">
                <span class="platform-name">Boom</span>
                <span class="btn-action group-hover:opacity-100">Слушать</span>
            </a>
        </div>

        <footer class="mt-16 text-center">
            <p class="font-dela text-[9px] italic opacity-20 hover:opacity-100 transition duration-700">© 2026 LH DISTRIBUTION</p>
        </footer>
    </div>

</body>
</html>
