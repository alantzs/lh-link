<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzerSlow, WBREG999 - NO PARES</title>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #a020f0; /* Фиолетовый LH RECORDS */
            --bg: #050505; 
        }
        
        body {
            background-color: var(--bg);
            /* Фон с твоей обложкой и блюром */
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('NO PARES - Cover.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .content { width: 100%; max-width: 400px; text-align: center; }

        .cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 30px rgba(160, 32, 240, 0.3);
            margin-bottom: 30px;
            object-fit: cover;
            border: 1px solid rgba(160, 32, 240, 0.4);
        }

        h1 { 
            font-family: 'Dela Gothic One', cursive; 
            font-size: 28px; 
            margin: 0 0 10px 0; 
            text-transform: uppercase; 
            color: #fff;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .artists { 
            font-size: 14px; 
            color: #888; 
            margin-bottom: 40px; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Список всех площадок */
        .links-container { 
            background: rgba(255, 255, 255, 0.02); 
            border-radius: 28px; 
            overflow: hidden; 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .link-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 25px;
            text-decoration: none;
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .link-row:last-child { border-bottom: none; }
        
        .link-row:hover { 
            background: rgba(160, 32, 240, 0.15); 
        }

        .platform-name { 
            font-weight: 700; 
            font-size: 12px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
        }

        .play-btn {
            background: transparent;
            border: 1.5px solid var(--accent);
            color: var(--accent);
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .link-row:hover .play-btn { 
            background: var(--accent); 
            color: #fff; 
            box-shadow: 0 0 15px var(--accent);
        }

        .footer {
            margin-top: 50px;
            font-size: 9px;
            color: #444;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 900;
        }
    </style>
</head>
<body>

    <div class="content">
        <img src="NO PARES - Cover.jpg" class="cover" alt="NO PARES Cover">
        
        <h1>NO PARES</h1>
        <div class="artists">AzerSlow, WBREG999</div>

        <div class="links-container">
            <a href="https://music.yandex.ru/album/40193187" target="_blank" class="link-row">
                <span class="platform-name">Yandex Music</span>
                <span class="play-btn">Listen</span>
            </a>
            <a href="https://music.apple.com/us/album/no-pares-single/1868820212" target="_blank" class="link-row">
                <span class="platform-name">Apple Music</span>
                <span class="play-btn">Listen</span>
            </a>
            <a href="https://music.vk.com/link/R19Zb" target="_blank" class="link-row">
                <span class="platform-name">VK Music</span>
                <span class="play-btn">Listen</span>
            </a>
            <a href="https://www.deezer.com/album/896899962" target="_blank" class="link-row">
                <span class="platform-name">Deezer</span>
                <span class="play-btn">Listen</span>
            </a>
            <a href="https://music.mts.ru/album/40193187" target="_blank" class="link-row">
                <span class="platform-name">MTS Music</span>
                <span class="play-btn">Listen</span>
            </a>
            <a href="https://music.apple.com/us/album/no-pares-single/1868820212?app=itunes" target="_blank" class="link-row">
                <span class="platform-name">iTunes</span>
                <span class="play-btn">Listen</span>
            </a>
        </div>

        <div class="footer">LH RECORDS | 2026</div>
    </div>

</body>
</html>
