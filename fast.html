<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Арт мой брат, Азер - Мы гоним быстро</title>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #1e0b35 0%, #07030a 100%);
            color: #ffffff;
            /* Основной шрифт - системный, для заголовков - Dela Gothic One */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .wrapper {
            max-width: 420px;
            width: 90%;
            text-align: center;
            padding: 40px 0;
        }

        .cover-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 50px;
        }

        .cover-art {
            width: 100%;
            height: 100%;
            border-radius: 45px;
            object-fit: cover;
            box-shadow: 0 15px 60px rgba(138, 43, 226, 0.4); 
            position: relative;
            z-index: 2;
        }

        .out-now {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #000000;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 3;
            /* Чтобы даже на кнопке был нужный вайб */
            font-family: 'Dela Gothic One', cursive;
        }

        .info-section {
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Dela Gothic One', cursive;
            font-size: 32px; /* Чуть уменьшил, так как шрифт очень широкий */
            margin: 0;
            text-transform: uppercase;
            line-height: 1.2;
            word-spacing: 5px;
        }

        .sub-text {
            font-size: 10px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 15px;
            font-weight: 600;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 28px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            text-decoration: none;
            color: #fff;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .platform {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .action {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="cover-container">
            <img src="cover1.jpg" alt="Cover" class="cover-art">
            <div class="out-now">Out Now</div>
        </div>
        
        <div class="info-section">
            <h1>Мы гоним быстро</h1>
            <div class="sub-text">Арт мой брат, Азер | LH RECORDS</div>
        </div>

        <div class="links">
            <a href="https://soundcloud.com/azerslow/azerone1" class="link-card" target="_blank">
                <span class="platform">SoundCloud</span>
                <span class="action">Слушать</span>
            </a>

            <a href="https://youtu.be/jFa93X1mraA?si=wowmDXxk5Ek6WV1w" class="link-card" target="_blank">
                <span class="platform">YouTube</span>
                <span class="action">Смотреть</span>
            </a>
        </div>
    </div>

</body>
</html>
